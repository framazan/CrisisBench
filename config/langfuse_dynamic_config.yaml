realism_eval_prompts_file: "/home/stanford/vf_copilot/evals/llm_patient/patient_eval_prompts.yaml"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  description: "Dynamic eval final double prompt"

# ── Dialogue generation ───────────────────────────────────────────────────────
dialogue:
  # Paths to prompt files used by the vf_copilot evals framework
  counselor_config_path: "/home/stanford/vf_copilot/gradio_demo/prompts.yaml"
  patient_editor_config_path: "/home/stanford/vf_copilot/evals/llm_patient/data/patient_profile_editor_prompts.yaml"

  initial_counselor_message: "Hi there, to start can you tell me your name and a little bit about what's been going on?"
  max_messages: 100

  # Prompt keys (resolved from the respective config YAML files above)
  counselor_prompt: "base_instructions3"
  editor_prompt: 'second_call_with_history3'
  patient_editor_prompt: null   # set to a key string to enable patient editing

  # Models – only OPENAI_API_KEY is used
  counselor_model: "gpt-5.2"
  patient_model: "gpt-4.1"

  counselor_api_url: "https://api.openai.com/v1/chat/completions"
  counselor_api_key_env: "OPENAI_API_KEY"
  patient_api_url: "https://api.openai.com/v1/chat/completions"
  patient_api_key_env: "OPENAI_API_KEY"

  counselor_temperature: 1
  max_counselor_tokens: 400
  max_patient_tokens: 200
  patient_temperature: 0.5
  counselor_reasoning_effort: "low"

  # ── RAG settings (counselor draft prompt, every turn) ───────────────────
  use_rag: False                       # Enable RAG-augmented counselor prompt
  rag_embeddings_model: "text-embedding-3-large"           # e.g. "text-embedding-3-small" (required if use_rag is true)
  historical_conversations: '/home/stanford/vf_copilot/langfuse_scripts/final_paper_analysis/200_perfect_scoring_historical_FOR_RAG.csv'       # Path to CSV with historical conversations (required if use_rag is true)
  rag_top_k: 2                         # Number of similar (context, response) pairs to retrieve
  counselor_rag_prompt: "rag_dynamic_instructions"  # Prompt key to use when RAG is active

# ── Evaluation ────────────────────────────────────────────────────────────────
eval:
  realism_eval: true
  # Subset of keys from patient_eval_prompts_file to run (comment out to skip)
  prompts:
    - counselor-eval-rubric
    # - "language_patterns"
    # - "presenting_concern"
    # - "big_five_traits_simple"
    # - "emotional_realism"
  model: "gpt-4.1"
  max_completion_tokens: 1800
  temperature: 0.1

# ── Concurrency ───────────────────────────────────────────────────────────────
max_workers: 5
